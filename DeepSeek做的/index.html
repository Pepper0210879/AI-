<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日AI日报</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header animate-in">
      <div class="header__left">
        <h1>每日AI日报</h1>
        <p class="header__date" id="headerDate"></p>
      </div>
      <a href="edit.html" class="btn btn--secondary">前往编辑</a>
    </header>

    <!-- 内容区 -->
    <main id="mainContent"></main>

    <!-- Footer -->
    <footer class="footer">每日AI日报 &mdash; 纯本地 &middot; 无服务器</footer>
  </div>

  <!-- Modal -->
  <div id="modalContainer"></div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    (function() {
      // ===== 常量 =====
      var STORAGE_KEY = 'ai_daily_report';
      var FOREIGN_VENDORS = ['OpenAI', 'Google', 'Anthropic', 'xAI', 'NVIDIA', 'Microsoft'];
      var DOMESTIC_VENDORS = ['阿里云', '火山引擎', 'DeepSeek', '腾讯', '智谱AI', 'MiniMax', '月之暗面', '华为'];
      var OTHER_CATEGORIES = [
        { key: 'otherVendors', label: '其他厂商' },
        { key: 'autonomousDriving', label: '自动驾驶' },
        { key: 'embodiedAI', label: '具身智能' },
        { key: 'aiGlobalization', label: 'AI出海' },
        { key: 'investment', label: '投资资讯' }
      ];
      var RANKINGS = [
        { key: 'lmarena', label: 'LMArena', icon: '&#x1F3C6;' },
        { key: 'openrouter', label: 'OpenRouter', icon: '&#x1F4CA;' },
        { key: 'producthunt', label: 'Product Hunt', icon: '&#x1F680;' }
      ];

      // ===== 工具函数 =====
      function today() {
        var d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      }

      function formatDate(dateStr) {
        var parts = dateStr.split('-');
        var weekdays = ['日', '一', '二', '三', '四', '五', '六'];
        var wd = weekdays[new Date(parts[0], parts[1] - 1, parts[2]).getDay()];
        return parts[0] + '年' + parseInt(parts[1]) + '月' + parseInt(parts[2]) + '日 · 星期' + wd;
      }

      function getData() {
        try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch(e) { return {}; }
      }

      function getTodayData() {
        return getData()[today()] || emptyReport();
      }

      function emptyReport() {
        var foreign = {}; FOREIGN_VENDORS.forEach(function(v) { foreign[v] = []; });
        var domestic = {}; DOMESTIC_VENDORS.forEach(function(v) { domestic[v] = []; });
        var other = {}; OTHER_CATEGORIES.forEach(function(c) { other[c.key] = []; });
        var rankings = {}; RANKINGS.forEach(function(r) { rankings[r.key] = []; });
        return { foreign: foreign, domestic: domestic, other: other, rankings: rankings };
      }

      // 兼容旧数据：如果值是字符串，转为单条新闻数组
      function normalizeNews(val) {
        if (!val) return [];
        if (Array.isArray(val)) return val;
        if (typeof val === 'string') {
          var trimmed = val.trim();
          return trimmed ? [{ title: '', summary: trimmed, link: '' }] : [];
        }
        return [];
      }

      function normalizeSectionData(sectionData, keys) {
        var result = {};
        keys.forEach(function(k) {
          result[k] = normalizeNews(sectionData[k]);
        });
        return result;
      }

      function getNormalizedData() {
        var raw = getTodayData();
        return {
          foreign: normalizeSectionData(raw.foreign || {}, FOREIGN_VENDORS),
          domestic: normalizeSectionData(raw.domestic || {}, DOMESTIC_VENDORS),
          other: normalizeSectionData(raw.other || {}, OTHER_CATEGORIES.map(function(c) { return c.key; })),
          rankings: normalizeSectionData(raw.rankings || {}, RANKINGS.map(function(r) { return r.key; }))
        };
      }

      // ===== Toast =====
      var toastTimer = null;
      function showToast(msg) {
        var t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('toast--visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function() { t.classList.remove('toast--visible'); }, 2200);
      }

      // ===== Modal =====
      function openModal(name, newsList) {
        var container = document.getElementById('modalContainer');
        var hasMultiple = newsList.length > 1;
        var tabsHtml = '';
        var bodyHtml = '';

        if (newsList.length === 0) {
          bodyHtml = '<div class="modal__empty">暂无新闻内容</div>';
        } else if (newsList.length === 1) {
          bodyHtml = renderNewsContent(newsList[0]);
        } else {
          // 多条新闻：Tab 切换
          tabsHtml = '<div class="modal__tabs">';
          newsList.forEach(function(news, i) {
            var label = news.title || '新闻 ' + (i + 1);
            var activeClass = i === 0 ? ' modal__tab--active' : '';
            tabsHtml += '<button class="modal__tab' + activeClass + '" data-tab="' + i + '">' + escHtml(label) + '</button>';
          });
          tabsHtml += '</div>';
          bodyHtml = '<div class="modal__body" id="modalBody">' + renderNewsContent(newsList[0]) + '</div>';
        }

        var html = '<div class="modal-overlay" id="modalOverlay">';
        html += '<div class="modal">';
        html += '<div class="modal__header">';
        html += '<div class="modal__title">' + escHtml(name) + '</div>';
        html += '<button class="modal__close" id="modalClose">&times;</button>';
        html += '</div>';
        html += tabsHtml;
        if (newsList.length <= 1) {
          html += '<div class="modal__body">' + bodyHtml + '</div>';
        } else {
          html += bodyHtml;
        }
        html += '</div></div>';

        container.innerHTML = html;
        document.body.style.overflow = 'hidden';

        // 关闭事件
        document.getElementById('modalClose').addEventListener('click', closeModal);
        document.getElementById('modalOverlay').addEventListener('click', function(e) {
          if (e.target === e.currentTarget) closeModal();
        });

        // Tab 切换事件
        if (hasMultiple) {
          var tabs = container.querySelectorAll('.modal__tab');
          tabs.forEach(function(tab) {
            tab.addEventListener('click', function() {
              var idx = parseInt(this.getAttribute('data-tab'));
              tabs.forEach(function(t) { t.classList.remove('modal__tab--active'); });
              this.classList.add('modal__tab--active');
              document.getElementById('modalBody').innerHTML = renderNewsContent(newsList[idx]);
            });
          });
        }

        // ESC 关闭
        document.addEventListener('keydown', onEscKey);
      }

      function renderNewsContent(news) {
        var title = news.title || '未命名新闻';
        var summary = news.summary || '暂无摘要';
        var link = news.link || '';
        var html = '<div class="modal__news-title">' + escHtml(title) + '</div>';
        html += '<div class="modal__news-summary">' + escHtml(summary).replace(/\n/g, '<br>') + '</div>';
        if (link) {
          html += '<a href="' + escAttr(link) + '" target="_blank" rel="noopener" class="modal__news-link">';
          html += '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';
          html += '查看原文';
          html += '</a>';
        }
        return html;
      }

      function closeModal() {
        document.getElementById('modalContainer').innerHTML = '';
        document.body.style.overflow = '';
        document.removeEventListener('keydown', onEscKey);
      }

      function onEscKey(e) {
        if (e.key === 'Escape') closeModal();
      }

      function escHtml(str) {
        var div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      function escAttr(str) {
        return str.replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      // ===== 卡片点击 =====
      function onCardClick(name, newsList) {
        if (newsList.length === 0) return; // 空卡片不弹窗
        openModal(name, newsList);
      }

      // ===== 渲染 =====
      function renderNewsCard(name, newsList) {
        var isEmpty = newsList.length === 0;
        var previewText = '';
        var badgeHtml = '';

        if (!isEmpty) {
          var first = newsList[0];
          previewText = first.summary || first.title || '';
          if (newsList.length > 1) {
            badgeHtml = '<span class="news-card__badge">' + newsList.length + '条</span>';
          }
        }

        var cls = 'news-card animate-in';
        if (isEmpty) cls += ' news-card--empty';

        var onclickAttr = isEmpty ? '' : ' onclick="window._onCardClick(this)"';
        var dataAttr = isEmpty ? '' : ' data-name="' + escAttr(name) + '" data-news="' + escAttr(JSON.stringify(newsList)) + '"';

        return '<div class="' + cls + '"' + onclickAttr + dataAttr + '>' +
          '<div class="news-card__name">' + escHtml(name) + badgeHtml + '</div>' +
          '<div class="news-card__preview">' + escHtml(isEmpty ? '暂无内容' : previewText) + '</div>' +
          '</div>';
      }

      function renderRankingCard(label, icon, newsList) {
        var isEmpty = newsList.length === 0;
        var previewText = '';
        if (!isEmpty) {
          var first = newsList[0];
          previewText = first.summary || first.title || '';
        }
        var cls = 'ranking-card animate-in';
        if (isEmpty) cls += ' ranking-card--empty';

        var onclickAttr = isEmpty ? '' : ' onclick="window._onCardClick(this)"';
        var dataAttr = isEmpty ? '' : ' data-name="' + escAttr(label) + '" data-news="' + escAttr(JSON.stringify(newsList)) + '"';

        return '<div class="' + cls + '"' + onclickAttr + dataAttr + '>' +
          '<div class="ranking-card__icon">' + icon + '</div>' +
          '<div class="ranking-card__info">' +
          '<div class="ranking-card__name">' + escHtml(label) + '</div>' +
          '<div class="ranking-card__preview">' + escHtml(isEmpty ? '暂无内容' : previewText) + '</div>' +
          '</div></div>';
      }

      function render() {
        var data = getNormalizedData();
        var hasContent = checkHasContent(data);

        if (!hasContent) {
          document.getElementById('mainContent').innerHTML =
            '<div class="empty-state animate-in">' +
            '<div class="empty-state__icon">&#x1F4F0;</div>' +
            '<div class="empty-state__text">今日日报尚未编辑</div>' +
            '<div class="empty-state__hint">点击右上角「前往编辑」开始记录今日 AI 资讯</div>' +
            '</div>';
          return;
        }

        var html = '';

        // 重点关注 - 国外
        html += '<section class="section animate-in">';
        html += '<div class="section__header section__header--rose">重点关注 · 国外厂商</div>';
        html += '<div class="vendor-grid">';
        FOREIGN_VENDORS.forEach(function(v) {
          html += renderNewsCard(v, data.foreign[v]);
        });
        html += '</div>';

        // 重点关注 - 国内
        html += '<div class="section__subheader">国内主要厂商</div>';
        html += '<div class="vendor-grid">';
        DOMESTIC_VENDORS.forEach(function(v) {
          html += renderNewsCard(v, data.domestic[v]);
        });
        html += '</div>';
        html += '</section>';

        // 其他关注
        html += '<section class="section animate-in">';
        html += '<div class="section__header section__header--lavender">其他关注</div>';
        html += '<div class="vendor-grid">';
        OTHER_CATEGORIES.forEach(function(c) {
          html += renderNewsCard(c.label, data.other[c.key]);
        });
        html += '</div>';
        html += '</section>';

        // 榜单
        html += '<section class="section animate-in">';
        html += '<div class="section__header section__header--mint">榜单情况</div>';
        RANKINGS.forEach(function(r) {
          html += renderRankingCard(r.label, r.icon, data.rankings[r.key]);
        });
        html += '</section>';

        document.getElementById('mainContent').innerHTML = html;

        // 绑定卡片点击事件（通过委托）
        bindCardClicks();
      }

      function bindCardClicks() {
        window._onCardClick = function(el) {
          var name = el.getAttribute('data-name');
          var newsList = JSON.parse(el.getAttribute('data-news'));
          onCardClick(name, newsList);
        };
      }

      function checkHasContent(data) {
        function sectionHas(section, keys) {
          return keys.some(function(k) { return section[k] && section[k].length > 0; });
        }
        if (sectionHas(data.foreign, FOREIGN_VENDORS)) return true;
        if (sectionHas(data.domestic, DOMESTIC_VENDORS)) return true;
        if (sectionHas(data.other, OTHER_CATEGORIES.map(function(c) { return c.key; }))) return true;
        if (sectionHas(data.rankings, RANKINGS.map(function(r) { return r.key; }))) return true;
        return false;
      }

      // ===== 跨页面同步 =====
      window.addEventListener('storage', function(e) {
        if (e.key === STORAGE_KEY) render();
      });

      document.addEventListener('visibilitychange', function() {
        if (!document.hidden) render();
      });

      // ===== 初始化 =====
      document.getElementById('headerDate').textContent = formatDate(today());
      render();
    })();
  </script>
</body>
</html>
