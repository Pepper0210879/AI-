<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>编辑日报 — 每日AI日报</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="edit-header animate-in">
      <div class="edit-header__left">
        <h1>编辑日报</h1>
        <span class="edit-header__date" id="editDate"></span>
      </div>
      <a href="index.html" class="btn btn--secondary" id="backBtn">返回主页</a>
    </header>

    <!-- 表单 -->
    <form id="reportForm" autocomplete="off">
      <!-- 重点关注：国外 -->
      <div class="form-section animate-in" id="sectionForeign">
        <div class="form-section__header form-section__header--rose">重点关注 · 国外厂商</div>
        <div id="foreignEditors"></div>
      </div>

      <!-- 重点关注：国内 -->
      <div class="form-section animate-in" id="sectionDomestic">
        <div class="form-section__header form-section__header--peach">重点关注 · 国内厂商</div>
        <div id="domesticEditors"></div>
      </div>

      <!-- 其他关注 -->
      <div class="form-section animate-in" id="sectionOther">
        <div class="form-section__header form-section__header--lavender">其他关注</div>
        <div id="otherEditors"></div>
      </div>

      <!-- 榜单 -->
      <div class="form-section animate-in" id="sectionRankings">
        <div class="form-section__header form-section__header--mint">榜单情况</div>
        <div id="rankingEditors"></div>
      </div>

      <!-- 操作按钮 -->
      <div class="editor-actions">
        <button type="submit" class="btn btn--primary btn--lg">保存并返回主页</button>
        <button type="button" class="btn btn--secondary btn--lg" id="saveDraftBtn">保存草稿</button>
      </div>
    </form>
  </div>

  <div class="toast" id="toast"></div>
  <div id="dialogContainer"></div>

  <script>
    (function() {
      // ===== 常量 =====
      var STORAGE_KEY = 'ai_daily_report';
      var FOREIGN_VENDORS = ['OpenAI', 'Google', 'Anthropic', 'xAI', 'NVIDIA', 'Microsoft'];
      var DOMESTIC_VENDORS = ['阿里云', '火山引擎', 'DeepSeek', '腾讯', '智谱AI', 'MiniMax', '月之暗面', '华为'];
      var OTHER_CATEGORIES = [
        { key: 'otherVendors', label: '其他厂商' },
        { key: 'autonomousDriving', label: '自动驾驶' },
        { key: 'embodiedAI', label: '具身智能' },
        { key: 'aiGlobalization', label: 'AI出海' },
        { key: 'investment', label: '投资资讯' }
      ];
      var RANKINGS = [
        { key: 'lmarena', label: 'LMArena' },
        { key: 'openrouter', label: 'OpenRouter' },
        { key: 'producthunt', label: 'Product Hunt' }
      ];

      function today() {
        var d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      }

      function formatDate(dateStr) {
        var parts = dateStr.split('-');
        var weekdays = ['日', '一', '二', '三', '四', '五', '六'];
        var wd = weekdays[new Date(parts[0], parts[1] - 1, parts[2]).getDay()];
        return parts[0] + '年' + parseInt(parts[1]) + '月' + parseInt(parts[2]) + '日 · 星期' + wd;
      }

      function getData() {
        try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch(e) { return {}; }
      }

      function saveData(date, report) {
        var all = getData();
        all[date] = report;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
      }

      // 兼容旧数据格式
      function normalizeNews(val) {
        if (!val) return [];
        if (Array.isArray(val)) return val;
        if (typeof val === 'string') {
          var trimmed = val.trim();
          return trimmed ? [{ title: '', summary: trimmed, link: '' }] : [];
        }
        return [];
      }

      function getTodayData() {
        var data = getData()[today()];
        if (!data) return null;
        var foreign = {}, domestic = {}, other = {}, rankings = {};

        FOREIGN_VENDORS.forEach(function(v) {
          foreign[v] = normalizeNews(data.foreign && data.foreign[v]);
        });
        DOMESTIC_VENDORS.forEach(function(v) {
          domestic[v] = normalizeNews(data.domestic && data.domestic[v]);
        });
        OTHER_CATEGORIES.forEach(function(c) {
          other[c.key] = normalizeNews(data.other && data.other[c.key]);
        });
        RANKINGS.forEach(function(r) {
          rankings[r.key] = normalizeNews(data.rankings && data.rankings[r.key]);
        });

        return { foreign: foreign, domestic: domestic, other: other, rankings: rankings };
      }

      // ===== Toast =====
      var toastTimer = null;
      function showToast(msg) {
        var t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('toast--visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function() { t.classList.remove('toast--visible'); }, 2200);
      }

      // ===== 转义 =====
      function escHtml(str) {
        var div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      // ===== 构建编辑器 =====
      function createVendorEditor(prefix, name, newsList) {
        var idBase = 'editor_' + prefix;
        var hasNews = newsList.length > 0;
        var openClass = hasNews ? ' vendor-editor--open' : '';

        var html = '<div class="vendor-editor' + openClass + '" id="' + idBase + '">';
        html += '<div class="vendor-editor__header">';
        html += '<span class="vendor-editor__name">' + escHtml(name) + '</span>';
        html += '<button type="button" class="vendor-editor__toggle" data-target="' + idBase + '">' + (hasNews ? '收起' : '展开') + '</button>';
        html += '</div>';
        html += '<div class="vendor-editor__body">';
        html += '<div class="vendor-editor__news-list" id="' + idBase + '_list"></div>';
        html += '<button type="button" class="vendor-editor__add-btn" data-target="' + idBase + '_list" data-prefix="' + prefix + '">+ 添加新闻条目</button>';
        html += '</div>';
        html += '</div>';

        return html;
      }

      function createNewsItem(prefix, index, news) {
        var title = news && news.title || '';
        var summary = news && news.summary || '';
        var link = news && news.link || '';
        var itemId = 'newsitem_' + prefix + '_' + index;

        var html = '<div class="news-item" id="' + itemId + '">';
        html += '<div class="news-item__header">';
        html += '<span class="news-item__index">新闻 #' + (index + 1) + '</span>';
        html += '<button type="button" class="news-item__remove" data-item="' + itemId + '" title="删除此条新闻">&times;</button>';
        html += '</div>';

        // Title
        html += '<div class="news-item__field">';
        html += '<label class="news-item__label">标题</label>';
        html += '<input type="text" class="news-item__input news-item__input--sm" value="' + escHtml(title) + '" placeholder="新闻标题" data-field="title" data-prefix="' + prefix + '" data-index="' + index + '">';
        html += '</div>';

        // Summary
        html += '<div class="news-item__field">';
        html += '<label class="news-item__label">摘要</label>';
        html += '<textarea class="news-item__input" rows="2" placeholder="新闻摘要内容" data-field="summary" data-prefix="' + prefix + '" data-index="' + index + '">' + escHtml(summary) + '</textarea>';
        html += '</div>';

        // Link
        html += '<div class="news-item__field">';
        html += '<label class="news-item__label">链接</label>';
        html += '<input type="url" class="news-item__input news-item__input--sm" value="' + escHtml(link) + '" placeholder="https://..." data-field="link" data-prefix="' + prefix + '" data-index="' + index + '">';
        html += '</div>';

        html += '</div>';
        return html;
      }

      function buildAllEditors(data) {
        buildSection('foreignEditors', FOREIGN_VENDORS, function(v) { return 'f_' + v; }, function(v) { return v; }, data.foreign);
        buildSection('domesticEditors', DOMESTIC_VENDORS, function(v) { return 'd_' + v; }, function(v) { return v; }, data.domestic);
        buildSection('otherEditors', OTHER_CATEGORIES, function(c) { return 'o_' + c.key; }, function(c) { return c.label; }, data.other);
        buildSection('rankingEditors', RANKINGS, function(r) { return 'r_' + r.key; }, function(r) { return r.label; }, data.rankings);
      }

      function buildSection(containerId, items, getPrefix, getLabel, sectionData) {
        var container = document.getElementById(containerId);
        var html = '';
        items.forEach(function(item) {
          var prefix = getPrefix(item);
          var label = getLabel(item);
          var newsList = sectionData[typeof item === 'string' ? item : item.key || item] || [];
          html += createVendorEditor(prefix, label, newsList);
        });
        container.innerHTML = html;

        // 填充新闻条目
        items.forEach(function(item) {
          var prefix = getPrefix(item);
          var key = typeof item === 'string' ? item : item.key || item;
          var newsList = sectionData[key] || [];
          var listEl = document.getElementById('editor_' + prefix + '_list');
          if (listEl) {
            renderNewsItems(listEl, prefix, newsList);
          }
        });
      }

      function renderNewsItems(listEl, prefix, newsList) {
        var html = '';
        newsList.forEach(function(news, i) {
          html += createNewsItem(prefix, i, news);
        });
        listEl.innerHTML = html;
        bindNewsItemEvents(listEl);
      }

      // ===== 事件绑定 =====
      function bindAllEvents() {
        // 折叠/展开
        document.querySelectorAll('.vendor-editor__toggle').forEach(function(btn) {
          btn.addEventListener('click', function() {
            var targetId = this.getAttribute('data-target');
            var editor = document.getElementById(targetId);
            if (editor) {
              editor.classList.toggle('vendor-editor--open');
              this.textContent = editor.classList.contains('vendor-editor--open') ? '收起' : '展开';
            }
          });
        });

        // 添加新闻条目
        document.querySelectorAll('.vendor-editor__add-btn').forEach(function(btn) {
          btn.addEventListener('click', function() {
            var listId = this.getAttribute('data-target');
            var prefix = this.getAttribute('data-prefix');
            var listEl = document.getElementById(listId);
            if (!listEl) return;

            // 获取当前最大索引
            var maxIdx = -1;
            listEl.querySelectorAll('.news-item').forEach(function(item) {
              var idx = parseInt(item.id.split('_').pop());
              if (idx > maxIdx) maxIdx = idx;
            });

            var newIdx = maxIdx + 1;
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = createNewsItem(prefix, newIdx, { title: '', summary: '', link: '' });
            var newItem = tempDiv.firstChild;
            listEl.appendChild(newItem);
            bindNewsItemEvents(listEl);

            // 确保展开
            var editor = listEl.closest('.vendor-editor');
            if (editor && !editor.classList.contains('vendor-editor--open')) {
              editor.classList.add('vendor-editor--open');
              var toggle = editor.querySelector('.vendor-editor__toggle');
              if (toggle) toggle.textContent = '收起';
            }

            // 聚焦新条目标题
            var titleInput = newItem.querySelector('input[data-field="title"]');
            if (titleInput) titleInput.focus();

            updateSnapshot();
          });
        });

        // 删除新闻条目
        document.querySelectorAll('.news-item__remove').forEach(function(btn) {
          btn.addEventListener('click', function() {
            var itemId = this.getAttribute('data-item');
            var item = document.getElementById(itemId);
            if (!item) return;
            var listEl = item.parentElement;
            item.remove();
            reindexNewsItems(listEl);
            updateSnapshot();

            // 如果列表为空，收起编辑器
            if (listEl.children.length === 0) {
              var editor = listEl.closest('.vendor-editor');
              if (editor) {
                editor.classList.remove('vendor-editor--open');
                var toggle = editor.querySelector('.vendor-editor__toggle');
                if (toggle) toggle.textContent = '展开';
              }
            }
          });
        });
      }

      function bindNewsItemEvents(listEl) {
        // 为新添加的条目绑定删除事件
        listEl.querySelectorAll('.news-item__remove').forEach(function(btn) {
          if (!btn._bound) {
            btn._bound = true;
            btn.addEventListener('click', function() {
              var itemId = this.getAttribute('data-item');
              var item = document.getElementById(itemId);
              if (!item) return;
              var parentList = item.parentElement;
              item.remove();
              reindexNewsItems(parentList);
              updateSnapshot();

              if (parentList.children.length === 0) {
                var editor = parentList.closest('.vendor-editor');
                if (editor) {
                  editor.classList.remove('vendor-editor--open');
                  var toggle = editor.querySelector('.vendor-editor__toggle');
                  if (toggle) toggle.textContent = '展开';
                }
              }
            });
          }
        });
      }

      function reindexNewsItems(listEl) {
        var items = listEl.querySelectorAll('.news-item');
        items.forEach(function(item, i) {
          item.querySelector('.news-item__index').textContent = '新闻 #' + (i + 1);
          item.querySelectorAll('[data-index]').forEach(function(field) {
            field.setAttribute('data-index', i);
          });
        });
      }

      // ===== 收集数据 =====
      function collectSection(prefixes, getKey) {
        var result = {};
        prefixes.forEach(function(item) {
          var prefix = getKey(item);
          var key = typeof item === 'string' ? item : item.key || item;
          var listEl = document.getElementById('editor_' + prefix + '_list');
          var newsList = [];
          if (listEl) {
            listEl.querySelectorAll('.news-item').forEach(function(newsItem) {
              var titleEl = newsItem.querySelector('[data-field="title"]');
              var summaryEl = newsItem.querySelector('[data-field="summary"]');
              var linkEl = newsItem.querySelector('[data-field="link"]');
              newsList.push({
                title: titleEl ? titleEl.value.trim() : '',
                summary: summaryEl ? summaryEl.value.trim() : '',
                link: linkEl ? linkEl.value.trim() : ''
              });
            });
            // 过滤掉完全为空的条目
            newsList = newsList.filter(function(n) { return n.title || n.summary || n.link; });
          }
          result[key] = newsList;
        });
        return result;
      }

      function collectFormData() {
        return {
          foreign: collectSection(FOREIGN_VENDORS, function(v) { return 'f_' + v; }),
          domestic: collectSection(DOMESTIC_VENDORS, function(v) { return 'd_' + v; }),
          other: collectSection(OTHER_CATEGORIES, function(c) { return 'o_' + c.key; }),
          rankings: collectSection(RANKINGS, function(r) { return 'r_' + r.key; })
        };
      }

      // ===== 变更追踪 =====
      function getSnapshot() {
        var texts = [];
        document.querySelectorAll('.news-item__input').forEach(function(el) {
          texts.push(el.value || '');
        });
        return texts.join('|');
      }

      var initialSnapshot = '';

      function updateSnapshot() {
        initialSnapshot = getSnapshot();
      }

      function hasUnsavedChanges() {
        return getSnapshot() !== initialSnapshot;
      }

      // ===== 保存 =====
      function save(showMsg) {
        var data = collectFormData();
        saveData(today(), data);
        updateSnapshot();
        if (showMsg !== false) showToast('已保存');
      }

      // ===== 离开确认 =====
      function showLeaveDialog(onConfirm) {
        var container = document.getElementById('dialogContainer');
        container.innerHTML =
          '<div class="dialog-overlay" id="dialogOverlay">' +
          '<div class="dialog">' +
          '<div class="dialog__title">未保存的更改</div>' +
          '<div class="dialog__body">你有未保存的内容，确定要离开吗？离开后未保存的内容将会丢失。</div>' +
          '<div class="dialog__actions">' +
          '<button class="btn btn--secondary" id="dialogCancel">继续编辑</button>' +
          '<button class="btn btn--primary" id="dialogConfirm">放弃并离开</button>' +
          '</div></div></div>';

        document.getElementById('dialogCancel').addEventListener('click', function() { container.innerHTML = ''; });
        document.getElementById('dialogConfirm').addEventListener('click', function() { container.innerHTML = ''; onConfirm(); });
        document.getElementById('dialogOverlay').addEventListener('click', function(e) {
          if (e.target === e.currentTarget) container.innerHTML = '';
        });
      }

      function navigateAway(url) {
        if (hasUnsavedChanges()) {
          showLeaveDialog(function() { window.location.href = url; });
        } else {
          window.location.href = url;
        }
      }

      // ===== 键盘快捷键 =====
      document.addEventListener('keydown', function(e) {
        if ((e.metaKey || e.ctrlKey) && e.key === 's') {
          e.preventDefault();
          save(true);
        }
      });

      // ===== 初始化 =====
      document.getElementById('editDate').textContent = formatDate(today());

      var existingData = getTodayData();
      var defaultData = {
        foreign: {}, domestic: {}, other: {}, rankings: {}
      };
      FOREIGN_VENDORS.forEach(function(v) { defaultData.foreign[v] = []; });
      DOMESTIC_VENDORS.forEach(function(v) { defaultData.domestic[v] = []; });
      OTHER_CATEGORIES.forEach(function(c) { defaultData.other[c.key] = []; });
      RANKINGS.forEach(function(r) { defaultData.rankings[r.key] = []; });

      buildAllEditors(existingData || defaultData);
      bindAllEvents();
      initialSnapshot = getSnapshot();

      // ===== 表单事件 =====
      document.getElementById('reportForm').addEventListener('submit', function(e) {
        e.preventDefault();
        save(true);
        setTimeout(function() { window.location.href = 'index.html'; }, 300);
      });

      document.getElementById('saveDraftBtn').addEventListener('click', function() {
        save(true);
      });

      document.getElementById('backBtn').addEventListener('click', function(e) {
        e.preventDefault();
        navigateAway('index.html');
      });

      // ===== 输入变化时更新快照 =====
      document.addEventListener('input', function(e) {
        if (e.target.classList.contains('news-item__input')) {
          updateSnapshot();
        }
      });

      // ===== 离开保护 =====
      window.addEventListener('beforeunload', function(e) {
        if (hasUnsavedChanges()) {
          e.preventDefault();
          e.returnValue = '';
        }
      });
    })();
  </script>
</body>
</html>
