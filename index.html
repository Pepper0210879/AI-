<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日AI早报</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="chatbot.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo-section">
                    <div class="logo-icon">
                        <i class="fas fa-robot"></i>
                    </div>
                    <div class="logo-info">
                        <div class="logo-top-row">
                            <h1 class="logo-text">Daily AI News</h1>
                            <span class="header-date" id="header-date"></span>
                        </div>
                    </div>
                </div>

                <div class="header-actions">
                    <div class="date-selector">
                        <button class="date-btn active" id="custom-date-btn">
                            <i class="fas fa-calendar-alt"></i>
                            <span>选择日期</span>
                        </button>
                        <input type="date" id="custom-date-input" class="custom-date-input" />
                    </div>

                    <div class="action-buttons">
                        <a href="admin.html" class="action-btn admin-btn" title="内容管理">
                            <i class="fas fa-cog"></i>
                            <span>管理</span>
                        </a>
                        <button class="action-btn export-btn" title="导出报告">
                            <i class="fas fa-download"></i>
                            <span>导出</span>
                        </button>
                    </div>
                    <span class="update-time-inline">更新 <span id="update-time"></span></span>
                </div>
            </div>

            <!-- Category Tabs -->
            <div class="category-tabs">
                <button class="tab-btn active" data-category="all">
                    <i class="fas fa-th-large"></i>
                    全部
                </button>
                <button class="tab-btn" data-category="overseas">
                    <i class="fas fa-globe-americas"></i>
                    海外厂商
                </button>
                <button class="tab-btn" data-category="domestic">
                    <i class="fas fa-flag"></i>
                    国内厂商
                </button>
                <button class="tab-btn" data-category="other">
                    <i class="fas fa-layer-group"></i>
                    其他关注
                </button>
                <button class="tab-btn" data-category="ranking">
                    <i class="fas fa-trophy"></i>
                    榜单情况
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">

            <!-- Content Grid -->
            <div class="content-grid" id="content-grid">
                <!-- 动态渲染 -->
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-content">
                <p>每日AI早报 — 每天为你精选 AI 领域最新动态</p>
                <div class="footer-links">
                    <span class="footer-link">
                        <i class="fas fa-envelope"></i>
                        联系方式：Qinjieyao@outlook.com
                    </span>
                </div>
            </div>
        </footer>

    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-spinner">
            <div class="spinner"></div>
            <p>正在获取最新内容...</p>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toast-message">操作成功</span>
    </div>

    <!-- Back to Top -->
    <button class="back-to-top" id="back-to-top" aria-label="回到顶部">
        <i class="fas fa-chevron-up"></i>
    </button>

    <!-- Vendor Detail Modal -->
    <div class="modal-overlay" id="vendor-modal">
        <div class="modal-container">
            <div class="modal-header">
                <div class="modal-vendor-info">
                    <div class="modal-vendor-icon" id="modal-vendor-icon"></div>
                    <div>
                        <h3 class="modal-vendor-name" id="modal-vendor-name"></h3>
                        <span class="modal-news-count" id="modal-news-count"></span>
                    </div>
                </div>
                <button class="modal-close" id="modal-close" aria-label="关闭弹窗">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <!-- 蘑菇助手 Chatbot -->
    <button class="chatbot-toggle" id="chatbot-toggle" aria-label="打开蘑菇助手">
        <span class="chatbot-toggle-icon">🍄</span>
    </button>

    <div class="chatbot-container" id="chatbot-container">
        <div class="chatbot-header">
            <div class="chatbot-header-left">
                <span class="chatbot-header-icon">🍄</span>
                <span class="chatbot-header-title">蘑菇新闻助手</span>
            </div>
            <div class="chatbot-header-actions">
                <button class="chatbot-header-btn" id="chatbot-clear-btn" title="清空对话">
                    <i class="fas fa-trash-can"></i>
                </button>
                <button class="chatbot-header-btn" id="chatbot-close-btn" title="收起">
                    <i class="fas fa-chevron-down"></i>
                </button>
            </div>
        </div>

        <div class="chatbot-messages" id="chatbot-messages"></div>

        <div class="chatbot-quick-prompts" id="chatbot-quick-prompts"></div>

        <div class="chatbot-input-area">
            <textarea class="chatbot-input" id="chatbot-input"
                placeholder="问我关于AI日报的任何问题..." rows="1"></textarea>
            <button class="chatbot-send-btn" id="chatbot-send-btn" aria-label="发送">🍄</button>
        </div>
    </div>

    <script src="seed-data.js?v=4"></script>
    <script src="data.js?v=2"></script>
    <script src="script.js?v=1"></script>
    <script src="chatbot.js"></script>
</body>
</html>
