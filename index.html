<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日AI早报</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="header-left">
                    <h1 class="header-title">
                        <i class="fas fa-robot"></i>
                        每日AI早报
                    </h1>
                    <span class="header-date" id="header-date"></span>
                </div>
                <div class="header-actions">
                    <div class="date-picker-wrapper">
                        <input type="date" id="date-picker" class="date-picker" title="选择日期查看历史早报">
                        <button class="action-btn" id="date-confirm-btn">
                            <i class="fas fa-check"></i>
                            <span>确认</span>
                        </button>
                        <a href="admin.html" class="action-btn admin-btn" title="后台管理">
                            <i class="fas fa-cog"></i>
                            <span>管理</span>
                        </a>
                        <button class="action-btn export-btn" title="导出报告">
                            <i class="fas fa-download"></i>
                            <span>导出</span>
                        </button>
                    </div>
                </div>
            </div>
            <div class="category-tabs">
                <button class="tab-btn active" data-category="all">全部</button>
                <button class="tab-btn" data-category="overseas">海外厂商</button>
                <button class="tab-btn" data-category="domestic">国内厂商</button>
                <button class="tab-btn" data-category="other">其他关注</button>
                <button class="tab-btn" data-category="ranking">榜单情况</button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <div class="content-grid" id="content-grid"></div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-content">
                <p>每日AI早报 — 每天为你精选 AI 领域最新动态</p>
                <div class="footer-links">
                    <span class="footer-link" id="contact-trigger" onclick="toggleContactBubble(event)">
                        <i class="fas fa-envelope"></i>
                        联系方式
                    </span>
                </div>
            </div>
        </footer>

        <!-- 联系方式气泡 -->
        <div class="contact-bubble" id="contact-bubble">
            <a href="mailto:Qinjieyao@outlook.com">Qinjieyao@outlook.com</a>
            <span class="contact-bubble-arrow"></span>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-spinner"></div>
        <p class="loading-text">加载中...</p>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">
        <span id="toast-message"></span>
    </div>

    <!-- Vendor Modal -->
    <div class="modal-overlay" id="vendor-modal">
        <div class="modal-container">
            <div class="modal-header">
                <div class="modal-vendor-info">
                    <div class="modal-vendor-icon" id="modal-vendor-icon"></div>
                    <div>
                        <h3 class="modal-vendor-name" id="modal-vendor-name"></h3>
                        <span class="modal-news-count" id="modal-news-count"></span>
                    </div>
                </div>
                <button class="modal-close" id="modal-close" aria-label="关闭弹窗">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
    <script>
    // 联系方式气泡 - 全局函数，不依赖任何异步加载
    function toggleContactBubble(e) {
        e.stopPropagation();
        var bubble = document.getElementById('contact-bubble');
        var trigger = document.getElementById('contact-trigger');
        var rect = trigger.getBoundingClientRect();
        bubble.style.top = (rect.top - 12) + 'px';
        bubble.style.left = (rect.left + rect.width / 2) + 'px';
        bubble.classList.toggle('show');
    }
    document.addEventListener('click', function(e) {
        var bubble = document.getElementById('contact-bubble');
        var trigger = document.getElementById('contact-trigger');
        if (e.target !== trigger && !trigger.contains(e.target) && !bubble.contains(e.target)) {
            bubble.classList.remove('show');
        }
    });
    </script>
</body>
</html>
