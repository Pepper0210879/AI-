<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日AI早报</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo-section">
                    <div class="logo-icon">
                        <i class="fas fa-robot"></i>
                    </div>
                    <div class="logo-info">
                        <div class="logo-top-row">
                            <h1 class="logo-text">Daily AI News</h1>
                            <span class="header-date" id="header-date"></span>
                        </div>
                    </div>
                </div>

                <div class="header-actions">
                    <div class="date-selector">
                        <button class="date-btn active" id="custom-date-btn">
                            <i class="fas fa-calendar-alt"></i>
                            <span>选择日期</span>
                        </button>
                        <input type="date" id="custom-date-input" class="custom-date-input" />
                    </div>

                    <div class="action-buttons">
                        <a href="admin.html" class="action-btn admin-btn" title="内容管理">
                            <i class="fas fa-cog"></i>
                            <span>管理</span>
                        </a>
                        <button class="action-btn export-btn" title="导出报告">
                            <i class="fas fa-download"></i>
                            <span>导出</span>
                        </button>
                    </div>
                    <span class="update-time-inline">更新 <span id="update-time"></span></span>
                </div>
            </div>

            <!-- Category Tabs -->
            <div class="category-tabs">
                <button class="tab-btn active" data-category="all">
                    <i class="fas fa-th-large"></i>
                    全部
                </button>
                <button class="tab-btn" data-category="overseas">
                    <i class="fas fa-globe-americas"></i>
                    海外厂商
                </button>
                <button class="tab-btn" data-category="domestic">
                    <i class="fas fa-flag"></i>
                    国内厂商
                </button>
                <button class="tab-btn" data-category="other">
                    <i class="fas fa-layer-group"></i>
                    其他关注
                </button>
                <button class="tab-btn" data-category="ranking">
                    <i class="fas fa-trophy"></i>
                    榜单情况
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">

            <!-- Content Grid -->
            <div class="content-grid" id="content-grid">
                <!-- 动态渲染 -->
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-content">
                <p>每日AI早报 — 每天为你精选 AI 领域最新动态</p>
                <div class="footer-links">
                    <a href="#" class="footer-link" id="footer-about">
                        <i class="fas fa-info-circle"></i>
                        关于
                    </a>
                    <a href="mailto:Qinjieyao@outlook.com" class="footer-link">
                        <i class="fas fa-envelope"></i>
                        订阅
                    </a>
                </div>
            </div>
        </footer>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-spinner">
            <div class="spinner"></div>
            <p>正在获取最新内容...</p>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toast-message">操作成功</span>
    </div>

    <!-- Back to Top -->
    <button class="back-to-top" id="back-to-top" aria-label="回到顶部">
        <i class="fas fa-chevron-up"></i>
    </button>

    <!-- Vendor Detail Modal -->
    <div class="modal-overlay" id="vendor-modal">
        <div class="modal-container">
            <div class="modal-header">
                <div class="modal-vendor-info">
                    <div class="modal-vendor-icon" id="modal-vendor-icon"></div>
                    <div>
                        <h3 class="modal-vendor-name" id="modal-vendor-name"></h3>
                        <span class="modal-news-count" id="modal-news-count"></span>
                    </div>
                </div>
                <button class="modal-close" id="modal-close" aria-label="关闭弹窗">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <!-- 密钥弹窗 -->
    <div class="modal-overlay" id="key-modal">
        <div class="modal-container key-modal-container">
            <div class="modal-header">
                <h3 class="modal-vendor-name">导出 PDF</h3>
                <button class="modal-close" id="key-modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <p style="margin-bottom:0.75rem;color:#666;">请输入下载密钥</p>
                <input type="password" id="key-input" placeholder="请输入密钥" style="width:100%;padding:0.6rem 0.75rem;border:1px solid #ddd;border-radius:6px;font-size:0.95rem;">
                <p id="key-error" style="color:#e74c3c;font-size:0.85rem;margin-top:0.5rem;display:none;"></p>
                <div style="margin-top:1rem;display:flex;gap:0.5rem;">
                    <button id="key-submit" style="flex:1;padding:0.6rem;background:#4a9eff;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:0.9rem;">确认</button>
                    <button id="key-cancel" style="flex:1;padding:0.6rem;background:#f0f0f0;color:#333;border:none;border-radius:6px;cursor:pointer;font-size:0.9rem;">取消</button>
                </div>
                <p style="margin-top:0.75rem;font-size:0.8rem;color:#999;">没有密钥？<a href="mailto:Qinjieyao@outlook.com" style="color:#4a9eff;">联系订阅</a></p>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
