<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>内容管理 — 每日AI早报</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- 登录遮罩 -->
    <div class="login-overlay" id="login-overlay">
        <div class="login-box">
            <div class="login-icon">
                <i class="fas fa-user-check"></i>
            </div>
            <h2>后台管理</h2>
            <p class="login-hint">请输入您的大名儿</p>
            <input type="text" id="login-name" class="login-input" placeholder="输入姓名" autofocus autocomplete="off">
            <p class="login-error" id="login-error"></p>
            <button class="login-btn" id="login-btn">进入后台</button>
        </div>
    </div>

    <div class="app-container">
        <header class="header">
            <div class="header-content">
                <div class="logo-section">
                    <div class="logo-icon">
                        <i class="fas fa-pen-to-square"></i>
                    </div>
                    <div class="logo-info">
                        <h1 class="logo-text">内容管理</h1>
                        <p class="logo-subtitle">每日AI早报后台</p>
                    </div>
                </div>
                <div class="header-actions">
                    <span class="operator-badge" id="operator-badge" style="display:none;" title="当前操作人"></span>
                    <button class="action-btn save-btn" id="save-btn">
                        <i class="fas fa-check"></i>
                        <span>保存</span>
                    </button>
                    <button class="action-btn confirm-btn" id="confirm-btn">
                        <i class="fas fa-check-double"></i>
                        <span>确认当日新闻</span>
                    </button>
                    <button class="action-btn unconfirm-btn" id="unconfirm-btn" style="display:none;">
                        <i class="fas fa-rotate-left"></i>
                        <span>取消确认内容</span>
                    </button>
                    <button class="action-btn" id="clear-cache-btn" style="background:transparent;color:var(--text-secondary);border:1px dashed var(--border);font-size:0.75rem;" title="清除本地缓存，加载最新云端数据">
                        <i class="fas fa-sync-alt"></i>
                        <span>刷新缓存</span>
                    </button>
                    <a href="index.html" class="action-btn">
                        <i class="fas fa-arrow-left"></i>
                        <span>返回首页</span>
                    </a>
                    <button class="action-btn audit-btn" id="audit-btn" onclick="toggleAuditPanel()" title="审计日志">
                        <i class="fas fa-history"></i>
                        <span>日志</span>
                    </button>
                </div>
            </div>
            <div class="category-tabs" id="section-tabs">
                <button class="tab-btn active" data-section="overseas">海外厂商</button>
                <button class="tab-btn" data-section="domestic">国内厂商</button>
                <button class="tab-btn" data-section="other">其他关注</button>
                <button class="tab-btn" data-section="ranking">榜单情况</button>
            </div>
        </header>

        <main class="main-content">
            <div class="admin-editor" id="admin-editor"></div>
        </main>


        <!-- GitHub 同步配置 -->
        <div class="api-config-section" style="max-width:900px;margin:2rem auto;padding:0 2rem;">
            <div class="content-section" style="margin-bottom:2rem;">
                <div class="section-header" style="display:flex;align-items:center;gap:0.75rem;padding:1rem 1.25rem;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);cursor:pointer;" onclick="const body=this.nextElementSibling;body.style.display=body.style.display==='none'?'block':'none';this.classList.toggle('collapsed');">
                    <span style="font-size:1.5rem;">🔄</span>
                    <div>
                        <h3 style="margin:0;font-size:1rem;">GitHub 同步配置（多人协作）</h3>
                        <p class="logo-subtitle" style="margin:0;">配置后，保存数据将自动同步到 GitHub Pages，所有访客可见</p>
                    </div>
                </div>
                <div class="section-body" style="display:block;padding:1.25rem;background:var(--bg-card);border:1px solid var(--border);border-top:none;border-radius:0 0 var(--radius-lg) var(--radius-lg);">
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
                        <div style="grid-column: 1 / -1;">
                            <label style="display:block;font-size:0.8rem;color:var(--text-secondary);margin-bottom:0.3rem;">GitHub Personal Access Token</label>
                            <div style="display:flex;gap:0.5rem;">
                                <input type="password" id="github-token" style="flex:1;padding:0.45rem 0.6rem;border:1px solid var(--border);border-radius:6px;font-size:0.85rem;font-family:inherit;" placeholder="github_pat_...">
                                <button onclick="toggleGithubToken()" style="padding:0.45rem 0.8rem;background:transparent;border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:0.8rem;">👁️</button>
                            </div>
                        </div>
                        <div>
                            <label style="display:block;font-size:0.8rem;color:var(--text-secondary);margin-bottom:0.3rem;">仓库 Owner</label>
                            <input type="text" id="github-owner" style="width:100%;padding:0.45rem 0.6rem;border:1px solid var(--border);border-radius:6px;font-size:0.85rem;font-family:inherit;box-sizing:border-box;" value="Pepper0210879" placeholder="GitHub 用户名">
                        </div>
                        <div>
                            <label style="display:block;font-size:0.8rem;color:var(--text-secondary);margin-bottom:0.3rem;">仓库名称</label>
                            <input type="text" id="github-repo" style="width:100%;padding:0.45rem 0.6rem;border:1px solid var(--border);border-radius:6px;font-size:0.85rem;font-family:inherit;box-sizing:border-box;" value="AI-" placeholder="如 AI-">
                        </div>
                    </div>
                    <div style="margin-top:1rem;display:flex;gap:0.75rem;align-items:center;">
                        <button id="github-save-btn" style="padding:0.5rem 1.5rem;background:var(--text-primary);color:#fff;border:none;border-radius:6px;font-size:0.85rem;cursor:pointer;">保存 Token</button>
                        <button id="github-test-btn" style="padding:0.5rem 1rem;background:transparent;color:var(--text-secondary);border:1px solid var(--border);border-radius:6px;font-size:0.85rem;cursor:pointer;">测试连接</button>
                        <span id="github-status" style="font-size:0.8rem;color:var(--text-secondary);"></span>
                    </div>
                    <p style="font-size:0.72rem;color:var(--text-muted);margin-top:0.5rem;">⚠️ Token 仅保存在浏览器 localStorage，不会提交到代码仓库。需拥有仓库 Contents 读写权限。</p>
                </div>
            </div>
        </div>

        <footer class="footer">
            <div class="footer-content">
                <p id="save-status">数据加载中...</p>
            </div>
        </footer>

        <!-- 审计日志面板 -->
        <div class="audit-panel" id="audit-panel">
            <div class="audit-panel-header">
                <h3><i class="fas fa-history"></i> 操作日志</h3>
                <button class="audit-panel-close" onclick="toggleAuditPanel()">&times;</button>
            </div>
            <div class="audit-panel-body" id="audit-panel-body">
                <p style="color:var(--text-muted);text-align:center;padding:2rem;">加载中...</p>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toast-message">操作成功</span>
    </div>

    <!-- 确认当日新闻弹窗 -->
    <div class="modal-overlay" id="confirm-modal">
        <div class="modal-container confirm-modal-box">
            <div class="confirm-modal-icon">
                <i class="fas fa-check-double"></i>
            </div>
            <h3>确认当日新闻</h3>
            <p class="confirm-modal-text" id="confirm-modal-text">
                确认后将今日新闻数据锁定为 <strong id="confirm-date-text"></strong> 的最终版本，<br>首页可选择查看已确认日期的内容。
            </p>
            <div class="confirm-modal-actions">
                <button class="btn-cancel" id="confirm-cancel-btn">取消</button>
                <button class="btn-confirm" id="confirm-ok-btn">确认发布</button>
            </div>
        </div>
    </div>

    <!-- 取消确认弹窗 -->
    <div class="modal-overlay" id="unconfirm-modal">
        <div class="modal-container confirm-modal-box">
            <div class="confirm-modal-icon" style="background:#fef5f5;color:#c06060;">
                <i class="fas fa-rotate-left"></i>
            </div>
            <h3>取消确认内容</h3>
            <p class="confirm-modal-text">
                取消今日确认后，你可以继续编辑新闻内容，<br>然后<strong>再次确认发布</strong>。<br><br>是否取消？
            </p>
            <div class="confirm-modal-actions">
                <button class="btn-cancel" id="unconfirm-cancel-btn">返回</button>
                <button class="btn-confirm" id="unconfirm-ok-btn" style="background:#c06060;border-color:#c06060;">取消确认</button>
            </div>
        </div>
    </div>

    <script src="admin.js?v=4"></script>
</body>
</html>
